events {}

http {

    server {

        listen 80;

        server_name mernmax.com www.mernmax.com;

        location /api/ {
            proxy_pass http://server:5000;
        }


        location / {
            proxy_pass http://client:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}